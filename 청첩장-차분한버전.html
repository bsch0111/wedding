<style>
:root{
  --bg:#1d1f22;          /* 깊은 차콜 배경 */

  --panel:#2c2f34;
  --ink:#e9e4dc;         /* 부드러운 아이보리 글자 */
  --ink-soft:#a39c92;
  --line:#3a3d42;
  --accent:#b4937e;      /* 차분한 토프/로즈브라운 */
  --accent-soft:#7d6b5e;
  --groom:#8fa6b3;
  --bride:#c2998f;
  --maxw:430px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{background:#0e0f10;color:var(--ink);font-family:'Gowun Batang','Nanum Myeongjo',serif;line-height:1.9;letter-spacing:.01em;-webkit-font-smoothing:antialiased;}
.page{max-width:var(--maxw);margin:0 auto;background:var(--bg);overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,.6);position:relative;}
section{padding:82px 30px;position:relative;}

.reveal{opacity:0;transform:translateY(28px);transition:opacity 1.3s ease,transform 1.3s ease;}
.reveal.in{opacity:1;transform:none;}

/* 표지 */
.cover{height:100svh;min-height:640px;padding:0;display:flex;flex-direction:column;justify-content:space-between;color:#f3efe8;text-align:center;position:relative;overflow:hidden;}
.cover .bg{position:absolute;inset:0;background-position:center 35%;background-size:cover;background-repeat:no-repeat;animation:kenburns 22s ease-in-out infinite alternate;}
@keyframes kenburns{from{transform:scale(1.05)}to{transform:scale(1.15)}}
.cover .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,11,12,.55) 0%,rgba(10,11,12,.15) 34%,rgba(10,11,12,.25) 60%,rgba(8,9,10,.82) 100%);}
.cover .top,.cover .bottom{position:relative;z-index:2;}
.cover .top{padding:50px 30px 0;}
.cover .date-tag{font-family:'Cormorant Garamond',serif;letter-spacing:.46em;text-indent:.46em;font-size:15px;font-weight:500;opacity:.95;}
.cover .top .sub{font-size:12px;letter-spacing:.34em;margin-top:9px;opacity:.82;}
.cover .bottom{padding:0 30px 58px;}
.cover .names{font-family:'Parisienne',cursive;font-size:46px;line-height:1.15;text-shadow:0 2px 22px rgba(0,0,0,.55);}
.cover .kor{margin-top:14px;font-size:17px;letter-spacing:.5em;text-indent:.5em;font-weight:700;}
.cover .place{margin-top:18px;font-size:13px;letter-spacing:.12em;opacity:.85;}
.cover .scroll{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:2;width:1px;height:48px;background:rgba(255,255,255,.55);animation:scrollLine 2.4s ease-in-out infinite;}
@keyframes scrollLine{0%{height:0;opacity:0}40%{height:48px;opacity:1}100%{height:48px;opacity:0;transform:translate(-50%,32px)}}

/* 인사 */
.greet{text-align:center;background:var(--bg);}
.label{font-family:'Cormorant Garamond',serif;letter-spacing:.42em;text-indent:.42em;font-size:13px;color:var(--accent);font-weight:500;}
.ttl{font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:26px;line-height:1.55;color:var(--ink);margin:18px 0 28px;}
.divider{width:36px;height:1px;background:var(--accent-soft);margin:32px auto;}
.greet p{font-size:15px;color:var(--ink-soft);line-height:2.2;word-break:keep-all;}
.pair{display:flex;justify-content:center;gap:36px;margin-top:42px;}
.pair{gap:28px;}
.pair .who{text-align:center;line-height:1.6;}
.pair .who .role{font-family:'Cormorant Garamond',serif;letter-spacing:.2em;font-size:12px;color:var(--accent);}
.pair .who .par{font-size:12px;color:var(--ink-soft);margin-top:9px;line-height:1.55;word-break:keep-all;}
.pair .who .nm{font-size:21px;font-weight:700;color:var(--ink);margin-top:4px;}
.pair .amp{font-family:'Parisienne',cursive;font-size:30px;color:var(--accent-soft);align-self:center;}

/* 하객석 (앉아 있는 사람들) — 실루엣 뒷모습 */

.audience{position:relative;margin:22px -30px 0;padding-top:30px;display:flex;flex-direction:column;align-items:center;overflow:hidden;}

.aud-row{display:flex;justify-content:center;align-items:flex-end;gap:3px;}
.aud-row.r4{transform:scale(.60);opacity:.30;filter:blur(.7px);}
.aud-row.r3{transform:scale(.74);opacity:.44;filter:blur(.4px);margin-top:-16px;}
.aud-row.r2{transform:scale(.88);opacity:.66;margin-top:-18px;}
.aud-row.r1{transform:scale(1);opacity:.94;margin-top:-20px;z-index:3;}
.guest{width:46px;height:60px;flex:none;display:block;fill:url(#gGuest);}
/* 좌석 높이·크기를 살짝씩 달리해 자연스럽게 */
.guest:nth-child(2n){transform:translateY(3px) scale(.97);}
.guest:nth-child(3n){transform:translateY(-2px) scaleX(1.03);}
.guest:nth-child(5n){transform:translateY(2px) scale(1.02);}

/* 여정 */
.journey{background:var(--bg-soft);text-align:center;}
.journey .intro p{font-size:14px;color:var(--ink-soft);word-break:keep-all;margin-top:14px;}
.journey .step{margin-top:58px;}
.journey .step .no{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;letter-spacing:.18em;color:var(--accent);}
.journey .step h3{font-family:'Nanum Myeongjo',serif;font-size:19px;font-weight:700;margin:7px 0 20px;color:var(--ink);}
.frame{position:relative;border-radius:3px;overflow:hidden;box-shadow:0 22px 46px -24px rgba(0,0,0,.8);}
.frame img{width:100%;display:block;transition:transform 7s ease;}
.frame.in img{transform:scale(1.07);}
.journey .step p{font-size:14.5px;color:var(--ink-soft);margin-top:20px;line-height:2.05;word-break:keep-all;}

/* 갤러리 */
.gallery{background:var(--bg);text-align:center;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:36px;}
.grid .frame img{transition:transform .9s ease;}
.grid .frame:active img{transform:scale(1.06);}
.grid .span2{grid-column:span 2;}

/* 달력 */
.cal{background:var(--bg-soft);}
.cal .head{font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:29px;line-height:1.4;color:var(--accent);}
.cal table{width:100%;border-collapse:collapse;margin-top:32px;border-top:1px solid var(--accent-soft);border-bottom:1px solid var(--accent-soft);}
.cal th,.cal td{text-align:center;padding:11px 0;font-size:15px;color:var(--ink);}
.cal th{font-size:13px;color:var(--ink-soft);padding:16px 0;}
.cal th.sun,.cal td.sun{color:var(--bride);}
.cal td .mark{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--accent);color:#1d1f22;font-weight:700;animation:pulse 2.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(180,147,126,.4)}50%{box-shadow:0 0 0 11px rgba(180,147,126,0)}}
.cal .time{display:block;font-size:11px;color:var(--ink-soft);margin-top:6px;letter-spacing:.05em;}
.cal .dday{text-align:center;margin-top:28px;font-size:14px;color:var(--ink-soft);letter-spacing:.08em;}
.cal .dday b{color:var(--accent);font-weight:700;}

/* 계좌 */
.account{background:var(--bg);text-align:center;}
.account .lead{font-size:15px;color:var(--ink-soft);line-height:2.15;word-break:keep-all;}
.toggle{margin-top:22px;}
.acc-item{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-top:12px;overflow:hidden;text-align:left;}
.acc-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;cursor:pointer;user-select:none;font-size:16px;font-weight:700;}
.acc-head.groom{color:var(--groom);}
.acc-head.bride{color:var(--bride);}
.acc-head .arrow{transition:transform .35s ease;font-size:13px;color:var(--ink-soft);}
.acc-item.open .arrow{transform:rotate(180deg);}
.acc-body{max-height:0;overflow:hidden;transition:max-height .45s ease;}
.acc-item.open .acc-body{max-height:400px;}
.acc-row{padding:16px 22px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;}
.acc-row .info{line-height:1.6;}
.acc-row .info .rel{font-size:12px;color:var(--ink-soft);}
.acc-row .info .name{font-size:15px;font-weight:700;color:var(--ink);margin-top:1px;}
.acc-row .info .bank{font-size:13.5px;color:var(--ink-soft);margin-top:2px;}
.copy{flex:none;border:1px solid var(--line);background:var(--bg-soft);color:var(--ink-soft);font-size:12.5px;padding:8px 13px;border-radius:8px;cursor:pointer;font-family:inherit;transition:all .2s ease;}
.copy:active{background:var(--accent);color:#1d1f22;border-color:var(--accent);}

/* footer */
.foot{position:relative;overflow:hidden;background:var(--bg-soft);text-align:center;padding:78px 30px 180px;}
/* 마무리 사진 — 두 분을 가운데 은은하게, 위아래로 어둠에 스며들게 */
.foot .end-bg{position:absolute;inset:0;background-size:cover;background-position:center 46%;opacity:.20;
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 22%,#000 78%,transparent 100%);
          mask-image:linear-gradient(180deg,transparent 0%,#000 22%,#000 78%,transparent 100%);
  transform:scale(1.02);transition:transform 12s ease;}
.foot.reveal.in .end-bg{transform:scale(1.09);}
.foot .inner{position:relative;z-index:2;}
.foot .names{font-family:'Parisienne',cursive;font-size:32px;color:var(--accent);}
.foot .thanks{margin-top:16px;font-size:14px;color:var(--ink-soft);line-height:2;}
.foot .date{margin-top:24px;font-family:'Cormorant Garamond',serif;letter-spacing:.32em;font-size:12.5px;color:var(--ink-soft);}

/* toast */
.toast{position:fixed;left:50%;bottom:42px;transform:translate(-50%,20px);background:rgba(233,228,220,.96);color:#1d1f22;font-size:13px;padding:11px 20px;border-radius:24px;opacity:0;pointer-events:none;transition:all .3s ease;z-index:99;letter-spacing:.03em;font-weight:700;}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* ===== 반응형: 화면 폭에 맞춰 유동 스케일 ===== */
html,body{overflow-x:hidden;max-width:100%;}
img{max-width:100%;}
.page{width:100%;max-width:var(--maxw);}
section{padding:clamp(56px,14vw,82px) clamp(20px,6.5vw,30px);}
.cover{min-height:520px;}
.cover .top{padding:clamp(38px,11vw,50px) clamp(20px,6.5vw,30px) 0;}

.cover .date-tag{font-size:clamp(13px,3.8vw,15px);}
.cover .top .sub{font-size:clamp(10.5px,3vw,12px);}
.cover .names{font-size:clamp(33px,11vw,46px);word-break:break-word;}
.cover .kor{font-size:clamp(14px,4.4vw,17px);letter-spacing:.42em;text-indent:.42em;}

.ttl{font-size:clamp(21px,6.2vw,26px);}
.cal .head{font-size:clamp(23px,7.4vw,29px);}

.cal td .mark{width:clamp(32px,9vw,38px);height:clamp(32px,9vw,38px);}
.greet p,.account .lead{font-size:clamp(14px,4vw,15px);}
.acc-head{font-size:clamp(14px,4.3vw,16px);}
/* 하객석: 좁은 화면에서 넘치지 않도록 */
.audience{margin-left:calc(-1*clamp(20px,6.5vw,30px));margin-right:calc(-1*clamp(20px,6.5vw,30px));}
</style>

    <!-- 짧은 머리 -->
    <g id="gv-short"><use href="#gv-sh"/><ellipse cx="50" cy="50" rx="17" ry="19"/></g>
    <!-- 묶은 머리(쪽) -->
    <g id="gv-bun"><use href="#gv-sh"/><ellipse cx="50" cy="32" rx="7.5" ry="6.5"/><ellipse cx="50" cy="51" rx="16" ry="18.5"/></g>
    <!-- 긴 머리 -->
    <g id="gv-long"><use href="#gv-sh"/><path d="M31,50 C29,66 31,80 37,86 L63,86 C69,80 71,66 69,50 C69,33 31,33 31,50 Z"/><ellipse cx="50" cy="49" rx="15.5" ry="18"/></g>
    <!-- 중간(목덜미 머리) -->
    <g id="gv-mid"><use href="#gv-sh"/><path d="M36,52 C34,64 36,74 41,80 L59,80 C64,74 66,64 64,52 C64,38 36,38 36,52 Z"/><ellipse cx="50" cy="50" rx="16" ry="18"/></g>
  </defs>
</svg>

<div class="page">

  <!-- 표지 -->
  <section class="cover">
    <div class="bg" id="cover-bg"></div>
    <div class="veil"></div>
    <div class="top">
      <div class="date-tag" id="cover-date"></div>
      <div class="sub" id="cover-sub"></div>
    </div>
    <div class="bottom">
      <div class="names" id="cover-names"></div>
      <div class="kor" id="cover-kor"></div>
      <div class="place" id="cover-place"></div>
    </div>
    <div class="scroll"></div>
  </section>

  <!-- 인사말 -->
  <section class="greet reveal">
    <div class="label" id="greet-label"></div>
    <div class="ttl" id="greet-title"></div>
    <p id="greet-top"></p>
    <div class="divider"></div>
    <p id="greet-bottom"></p>
    <div class="pair">
      <div class="who"><div class="role" id="greet-groom-role"></div><div class="par" id="greet-groom-par"></div><div class="nm" id="greet-groom-name"></div></div>
      <div class="amp">&amp;</div>
      <div class="who"><div class="role" id="greet-bride-role"></div><div class="par" id="greet-bride-par"></div><div class="nm" id="greet-bride-name"></div></div>
    </div>
    <div class="aud-caption">together with those who join us</div>
    <div class="audience" id="audience" aria-hidden="true"></div>
  </section>

  <!-- 여정 -->
  <section class="journey">
    <div class="intro reveal">
      <div class="label" id="journey-label"></div>
      <div class="ttl" style="margin-bottom:6px;" id="journey-title"></div>
      <p id="journey-subtitle"></p>
    </div>
    <div id="journey-steps"></div>
  </section>

  <!-- 갤러리 -->
  <section class="gallery">
    <div class="reveal">
      <div class="label" id="gallery-label"></div>
      <div class="ttl" style="margin-bottom:0;" id="gallery-title"></div>
    </div>
    <div class="grid reveal" id="gallery-grid"></div>
  </section>

  <!-- 달력 -->
  <section class="cal">
    <div class="reveal">
      <div class="head" id="cal-head"></div>
      <table id="cal-table"></table>
      <div class="dday" id="cal-dday"></div>
    </div>
  </section>

  <!-- 계좌 -->
  <section class="account">
    <div class="reveal">
      <div class="label" id="acc-label"></div>
      <div class="ttl" id="acc-title"></div>
      <p class="lead" id="acc-lead"></p>
      <p class="lead" style="margin-top:20px;font-size:13.5px;" id="acc-note"></p>
      <div class="toggle" id="acc-toggle"></div>
    </div>
  </section>

  <!-- 마무리 -->
  <footer class="foot reveal">
    <div class="end-bg" id="foot-bg" aria-hidden="true"></div>
    <div class="inner">
      <div class="names" id="foot-names"></div>
      <div class="thanks" id="foot-thanks"></div>
      <div class="date" id="foot-date"></div>
    </div>
  </footer>

</div>

<div class="toast" id="toast">계좌번호가 복사되었습니다</div>

<script>
(function () {
  const C = CONFIG;
  const nl = (s) => (s || "").replace(/\n/g, "<br/>");
  const $ = (id) => document.getElementById(id);

  document.title = C.meta.title;
  $("og-title").setAttribute("content", C.meta.title);
  $("og-desc").setAttribute("content", C.meta.description);

  const cv = C.cover;
  $("cover-bg").style.backgroundImage = `url('${cv.image}')`;
  $("cover-date").textContent = cv.dateTag;
  $("cover-sub").textContent = cv.subEng;
  $("cover-names").textContent = cv.namesEng;
  $("cover-kor").textContent = cv.namesKor;
  $("cover-place").textContent = cv.place;

  const g = C.greeting;
  $("greet-label").textContent = g.label;
  $("greet-title").innerHTML = nl(g.title);
  $("greet-top").innerHTML = nl(g.paragraphsTop);
  $("greet-bottom").innerHTML = nl(g.paragraphsBottom);
  $("greet-groom-role").textContent = g.groomRole;
  $("greet-groom-par").textContent = g.groomParents ? `${g.groomParents}의 ${g.groomRelation}` : "";
  $("greet-groom-name").textContent = g.groomName;
  $("greet-bride-role").textContent = g.brideRole;
  $("greet-bride-par").textContent = g.brideParents ? `${g.brideParents}의 ${g.brideRelation}` : "";
  $("greet-bride-name").textContent = g.brideName;

  /* 하객석 — 뒤에서 바라본 앉아 있는 사람들 (헤어스타일 섞어 다양하게, 뒷줄일수록 작고 흐리게) */
  (function buildAudience(){
    const rows = [{cls:"r4",n:15},{cls:"r3",n:13},{cls:"r2",n:11},{cls:"r1",n:9}];
    const variants = ["short","bun","long","mid","short","long","mid","bun","short","mid","long","short"];
    let k = 3; // 시작 오프셋(줄마다 패턴이 어긋나게)
    const guest = () => {
      const v = variants[k++ % variants.length];
      return `<svg class="guest" viewBox="0 0 100 128"><use href="#gv-${v}"/></svg>`;
    };
    $("audience").innerHTML = rows
      .map((r) => { k += 2; return `<div class="aud-row ${r.cls}">${Array.from({length:r.n}, guest).join("")}</div>`; })
      .join("");
  })();

  const j = C.journey;
  $("journey-label").textContent = j.label;
  $("journey-title").textContent = j.title;
  $("journey-subtitle").innerHTML = nl(j.subtitle);
  $("journey-steps").innerHTML = j.steps.map((s) => `
      <div class="step reveal">
        <div class="no">${s.no}</div>
        <h3>${s.title}</h3>
        <div class="frame"><img src="${s.image}" alt="${s.title}" loading="lazy" /></div>
        <p>${nl(s.desc)}</p>
      </div>`).join("");

  const ga = C.gallery;
  $("gallery-label").textContent = ga.label;
  $("gallery-title").textContent = ga.title;
  $("gallery-grid").innerHTML = ga.images.map((src, i) =>
    `<div class="frame${i === 0 ? " span2" : ""}"><img src="${src}" alt="갤러리 ${i + 1}" loading="lazy" /></div>`).join("");

  const cal = C.calendar;
  $("cal-head").innerHTML = nl(cal.headline);
  buildCalendar(cal);
  const weekday = ["일","월","화","수","목","금","토"][new Date(cal.year, cal.month - 1, cal.highlightDay).getDay()];
  $("cal-dday").innerHTML = `${cal.year}. ${String(cal.month).padStart(2,"0")}. ${String(cal.highlightDay).padStart(2,"0")} <b>·</b> ${cal.footnote || weekday}`;

  function buildCalendar(cal) {
    const first = new Date(cal.year, cal.month - 1, 1).getDay();
    const days = new Date(cal.year, cal.month, 0).getDate();
    let html = "<tr>" + ["일","월","화","수","목","금","토"].map((d,i)=>`<th class="${i===0?"sun":""}">${d}</th>`).join("") + "</tr>";
    let cells = [];
    for (let i=0;i<first;i++) cells.push("");
    for (let d=1;d<=days;d++) cells.push(d);
    while (cells.length % 7 !== 0) cells.push("");
    for (let w=0; w<cells.length/7; w++){
      html += "<tr>";
      for (let i=0;i<7;i++){
        const d = cells[w*7+i];
        const sun = i===0 ? " sun" : "";
        if (d === cal.highlightDay){
          html += `<td class="day${sun}"><span class="mark">${d}</span>${cal.timeLabel?`<span class="time">${cal.timeLabel}</span>`:""}</td>`;
        } else {
          html += `<td class="${sun.trim()}">${d}</td>`;
        }
      }
      html += "</tr>";
    }
    $("cal-table").innerHTML = html;
  }

  const a = C.account;
  $("acc-label").textContent = a.label;
  $("acc-title").textContent = a.title;
  $("acc-lead").innerHTML = nl(a.lead);
  $("acc-note").innerHTML = nl(a.note);
  $("acc-toggle").innerHTML = a.groups.map((grp) => `
      <div class="acc-item">
        <div class="acc-head ${grp.side}" onclick="toggleAcc(this)">
          <span>${grp.label}</span><span class="arrow">▾</span>
        </div>
        <div class="acc-body">
          ${grp.members.map((m) => `
            <div class="acc-row">
              <div class="info">
                <div class="rel">${m.rel}</div>
                <div class="name">${m.name}</div>
                <div class="bank">${m.bank} ${m.number}</div>
              </div>
              <button class="copy" onclick="copyAcc(event,'${m.number}')">복사</button>
            </div>`).join("")}
        </div>
      </div>`).join("");

  const f = C.footer;
  if (f.image) $("foot-bg").style.backgroundImage = `url('${f.image}')`;
  $("foot-names").textContent = f.namesEng;
  $("foot-thanks").innerHTML = nl(f.thanks);
  $("foot-date").textContent = f.date;

  const io = new IntersectionObserver((es)=>es.forEach((e)=>e.isIntersecting&&e.target.classList.add("in")),{threshold:0.16});
  document.querySelectorAll(".reveal").forEach((el)=>io.observe(el));
  const fio = new IntersectionObserver((es)=>es.forEach((e)=>e.isIntersecting&&e.target.classList.add("in")),{threshold:0.3});
  document.querySelectorAll(".frame").forEach((el)=>fio.observe(el));
})();

function toggleAcc(head){ head.parentElement.classList.toggle("open"); }
function copyAcc(ev, text){
  ev.stopPropagation();
  const num = text.replace(/[^0-9]/g, "");
  const toast = () => { const t = document.getElementById("toast"); t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(num).then(toast).catch(()=>fb(num,toast));
  } else fb(num, toast);
}
function fb(text, cb){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); cb(); } catch(e){}
  document.body.removeChild(ta);
}
</script>
</body>
</html>
